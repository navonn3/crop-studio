<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Crop Studio</title>
<meta name="theme-color" content="#0c0f15">
<style>
:root{--bg:#0c0f15;--panel:#151b25;--panel-2:#1c2531;--ink:#eef2f7;--muted:#93a0b2;--line:#28323f;--accent:#f5a524;--accent-ink:#1a1204;--miss:#e46a5c}
@media(prefers-color-scheme:light){:root{--bg:#ecebe6;--panel:#fff;--panel-2:#f4f2ec;--ink:#181510;--muted:#6b6558;--line:#ddd8cc;--accent:#d98a12;--accent-ink:#fff;--miss:#cf4636}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Segoe UI","Assistant",system-ui,Arial,sans-serif}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}
form{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:1.15rem}h1 b{color:var(--accent)}
input[type=password]{font:inherit;font-size:16px;padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink)}
button{font:inherit;font-weight:800;padding:10px;border-radius:9px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer}
label{font-size:.85rem;color:var(--muted);display:flex;gap:6px;align-items:center}
#err{color:var(--miss);font-size:.85rem;min-height:1em}
</style>
</head>
<body>
<form id="f">
  <h1>✂ <b>Crop</b> Studio</h1>
  <input type="password" id="pw" placeholder="סיסמה" autocomplete="current-password" autofocus>
  <label><input type="checkbox" id="rem" checked> זכור אותי במכשיר הזה</label>
  <button id="go">כניסה</button>
  <div id="err"></div>
</form>

const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
const KEY='cs_key_'+P.s;
async function decrypt(key){return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(P.i)},key,ub(P.c)));}
async function derive(pw){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:ub(P.s),iterations:P.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);}
// the key is handed to the app (it decrypts the game files in g/ with it)
// swap the gate for the app only once this page has fully loaded: a document.open() that lands while the gate is
// still loading (the remembered-key path is fast) can append the app NEXT TO the gate instead of replacing it
// (seen on Android Chrome: form + app side by side). The gate's form and styles are removed first either way.
function run(html,raw){html=html.replace('__CS_KEY__',()=>raw);
  const go=()=>{document.getElementById('f')?.remove();document.querySelectorAll('style').forEach(s=>s.remove());
    document.open();document.write(html);document.close();};
  if(document.readyState==='complete')go();else addEventListener('load',go,{once:true});}
(async()=>{let raw=null;try{raw=localStorage.getItem(KEY);}catch(e){}
  if(!raw)return;
  try{const key=await crypto.subtle.importKey('raw',ub(raw),'AES-GCM',false,['decrypt']);run(await decrypt(key),raw);}
  catch(e){try{localStorage.removeItem(KEY);}catch(_){}}})();
document.getElementById('f').onsubmit=async e=>{e.preventDefault();const err=document.getElementById('err'),go=document.getElementById('go');
  err.textContent='';go.disabled=true;
  try{const key=await derive(document.getElementById('pw').value);const html=await decrypt(key);
    const raw=b64(await crypto.subtle.exportKey('raw',key));
    if(document.getElementById('rem').checked){try{localStorage.setItem(KEY,raw);}catch(_){}}
    run(html,raw);}
  catch(_){err.textContent='סיסמה שגויה';go.disabled=false;}};
</script>
